name: Continuous Integration

on:
    push:
        branches:
            - main
            - test/*

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - run: |
                  set -e
                  cd tencentcloud
                  curl -sSL --fail https://github.com/cue-lang/cue/releases/download/v0.15.1/cue_v0.15.1_linux_amd64.tar.gz | tar -xzf - cue
                  ./cue version
                  ./cue cmd tf-gen
